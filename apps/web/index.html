<!doctype html>
<html lang="bn" data-theme="light" data-motion="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E6B50" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      T21.4 — preload the Bengali subset of Noto Sans Bengali (verified against
      public/fonts/ and the matching @font-face in src/index.css): bn is the
      LCP text of a Bengali-first app, so warming the font before CSS discovery
      removes a render-blocking round trip (MDN rel=preload; fonts are fetched
      in CORS mode, hence crossorigin even same-origin). Only this one font is
      preloaded — the latin subsets are small and font-display: swap already
      covers them.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/noto-bengali-variable-bengali.woff2"
    />
    <title>Daily Hisab — দৈনিক খরচের হিসাব</title>
    <script>
      /*
       * FOUC guard (prototype www/index.html init @1766): resolve the theme
       * and motion preference from localStorage BEFORE first paint. Kept in
       * sync with src/store/theme.ts (same keys, same defaults).
       */
      (function () {
        try {
          var t = localStorage.getItem("khoroch.theme");
          if (t !== "light" && t !== "dark") t = "light";
          document.documentElement.setAttribute("data-theme", t);
          var m = localStorage.getItem("khoroch.motion");
          if (m !== "on" && m !== "off") {
            m =
              window.matchMedia &&
              window.matchMedia("(prefers-reduced-motion: reduce)").matches
                ? "off"
                : "on";
          }
          document.documentElement.setAttribute("data-motion", m);
        } catch (e) {
          /* storage unavailable — defaults already set on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
